name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # Also exercises the install script, which must succeed on every platform
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build native addon
        if: runner.os == 'Windows'
        run: npm run prebuild
