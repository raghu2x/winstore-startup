name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prebuild:
    name: Prebuild - windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilds
        run: npm run prebuild -- --arch ${{ matrix.arch }}

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.arch }}
          path: prebuilds/
          retention-days: 1

  publish:
    name: Publish to npm & GitHub Release
    runs-on: ubuntu-latest
    needs: prebuild
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true

      # Trusted publishing (OIDC) needs npm >= 11.5.1; fail loudly if a runner
      # change ever drops below it, rather than silently falling back to a token.
      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm -v)"
          echo "npm $NPM_VERSION"
          npx --yes semver -r ">=11.5.1" "$NPM_VERSION" >/dev/null || {
            echo "npm $NPM_VERSION is too old for trusted publishing (need >=11.5.1)"
            exit 1
          }

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: prebuilds/**
